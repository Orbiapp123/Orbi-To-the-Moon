[package]
name    = "orbi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name       = "orbi"

[features]
no-entrypoint  = []
no-idl         = []
no-log-ix-name = []
cpi            = ["no-entrypoint"]
default        = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl  = { version = "0.29.0", features = ["token", "metadata"] }

[dev-dependencies]
anchor-client = "0.29.0"
solana-sdk    = "1.18"
